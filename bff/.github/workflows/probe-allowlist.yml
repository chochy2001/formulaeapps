name: Probe OpenRouter allowlist

# Detect drift between OPENROUTER_MODEL_ALLOWLIST (bff/src/lib/env.ts) and the
# live OpenRouter catalog (https://openrouter.ai/api/v1/models). OpenRouter
# silently removes deprecated models, so this gate runs on every change to the
# allowlist or the probe itself, plus monthly, plus on demand.
#
# Runner choice: GitHub-hosted ubuntu-latest (NOT the CAPDESIS self-hosted
# runner). The self-hosted runner has been intermittent for non-core repos and
# this probe is read-only against a public endpoint, so the marginal cloud
# minutes are worth the reliability.

on:
  push:
    branches: [main]
    paths:
      - bff/src/lib/env.ts
      - bff/scripts/probe-allowlist.ts
  pull_request:
    branches: [main]
    paths:
      - bff/src/lib/env.ts
      - bff/scripts/probe-allowlist.ts
  schedule:
    # Monthly: 09:00 UTC on day 1.
    - cron: '0 9 1 * *'
  workflow_dispatch:

concurrency:
  group: probe-allowlist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-allowlist:
    name: Probe OPENROUTER_MODEL_ALLOWLIST vs live catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Probe allowlist against OpenRouter catalog
        run: bun run scripts/probe-allowlist.ts
