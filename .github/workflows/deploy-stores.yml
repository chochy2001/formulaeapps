name: Deploy to stores

# Auto-deploy a PRODUCCIÓN (Play production track + App Store con
# submit_for_review y automatic_release) disparado por bumps de versión en
# main. Un push a main que toca community/pubspec.yaml o pro/pubspec.yaml
# publica esa app; workflow_dispatch permite el disparo manual por app.
#
# Kill switch: el pipeline se entrega DESARMADO. El job `guard` aborta hasta
# que la variable de repositorio STORE_AUTODEPLOY sea 'true'.
#
# Secrets a provisionar antes de activar el kill switch (nombres por app; el
# keystore formulae-upload.jks es compartido, así que ambos set ANDROID_*
# reciben el mismo material — ver docs 56/57 de fleet-modularization):
# - Android community: FORMULAE_COMMUNITY_ANDROID_KEYSTORE_BASE64,
#   FORMULAE_COMMUNITY_ANDROID_KEYSTORE_PASSWORD,
#   FORMULAE_COMMUNITY_ANDROID_KEY_ALIAS,
#   FORMULAE_COMMUNITY_ANDROID_KEY_PASSWORD.
# - Android pro: FORMULAE_PRO_ANDROID_KEYSTORE_BASE64,
#   FORMULAE_PRO_ANDROID_KEYSTORE_PASSWORD,
#   FORMULAE_PRO_ANDROID_KEY_ALIAS,
#   FORMULAE_PRO_ANDROID_KEY_PASSWORD.
# - Play (compartido fleet): GOOGLE_PLAY_SERVICE_ACCOUNT_JSON.
# - iOS (compartidos fleet): APP_STORE_KEY_ID, APP_STORE_ISSUER_ID,
#   APP_STORE_PRIVATE_KEY (contenido .p8 en base64), MATCH_GIT_URL,
#   MATCH_PASSWORD, MATCH_GIT_BASIC_AUTH.
# - AdMob community (el repo prohíbe IDs de producción en Git):
#   FORMULAE_COMMUNITY_ADMOB_ANDROID_APP_ID y
#   FORMULAE_COMMUNITY_ADMOB_IOS_APP_ID son obligatorios para cualquier build
#   release de community (gates nativos del repo). Opcionales:
#   FORMULAE_COMMUNITY_ADMOB_ENABLED ('true' exige los seis unit IDs) y
#   FORMULAE_COMMUNITY_ADMOB_ANDROID_BANNER_ID / _IOS_BANNER_ID /
#   _ANDROID_INTERSTITIAL_ID / _IOS_INTERSTITIAL_ID /
#   _ANDROID_APP_OPEN_ID / _IOS_APP_OPEN_ID. Sin ellos la app compila con
#   anuncios desactivados.
#
# CI gate: ci.yml sólo corre manual/programado en este repo, así que el job
# `ci-gate` exige un run completado de ci.yml en success para el SHA exacto.
# Si un bump no tiene CI verde aún, ejecuta ci.yml (workflow_dispatch) sobre
# main antes de esperar la publicación.
#
# El guard anti-duplicados de versionCode/build del diseño (doc 56 §3) queda
# como follow-up: las tiendas rechazan duplicados, pero el pipeline aún no
# falla antes de firmar.

on:
  push:
    branches: [main]
    paths:
      - 'community/pubspec.yaml'
      - 'pro/pubspec.yaml'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - community
          - pro
          - both
      ref:
        description: 'Exact main SHA to deploy (defaults to the current main head)'
        required: false
        default: ''
        type: string

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: formulaeapps-store-autodeploy
  cancel-in-progress: false

jobs:
  guard:
    name: Store auto-deploy kill switch
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require explicit STORE_AUTODEPLOY opt-in
        env:
          STORE_AUTODEPLOY: ${{ vars.STORE_AUTODEPLOY }}
        run: |
          set -euo pipefail
          if [ "$STORE_AUTODEPLOY" != "true" ]; then
            {
              echo "## Store auto-deploy disarmed"
              echo
              echo "- This pipeline publishes to the Play production track and submits to App Store review automatically."
              echo "- It stays disarmed until the repository variable \`STORE_AUTODEPLOY\` is set to \`true\`."
              echo "- Provision the store secrets first (see header comments in this workflow), then arm the kill switch."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Store auto-deploy is disarmed: set the STORE_AUTODEPLOY repository variable to 'true' to arm it."
            exit 1
          fi
          echo "STORE_AUTODEPLOY=true: pipeline armed."

  resolve:
    name: Resolve exact main SHA, apps and versions
    needs: guard
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      community: ${{ steps.release.outputs.community }}
      pro: ${{ steps.release.outputs.pro }}
      community_version: ${{ steps.release.outputs.community_version }}
      pro_version: ${{ steps.release.outputs.pro_version }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact main source and select apps
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_APP: ${{ inputs.app || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          sha_pattern='^[0-9a-f]{40}$'
          if [[ ! "$candidate_sha" =~ $sha_pattern || ! "$main_sha" =~ $sha_pattern ]]; then
            echo "::error::Unable to resolve immutable candidate and main commit SHAs."
            exit 1
          fi
          if [ "$candidate_sha" != "$main_sha" ]; then
            echo "::error::Store deploys are restricted to the exact current main commit."
            exit 1
          fi

          deploy_community=false
          deploy_pro=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_APP" = "community" ] || [ "$DISPATCH_APP" = "both" ]; then
              deploy_community=true
            fi
            if [ "$DISPATCH_APP" = "pro" ] || [ "$DISPATCH_APP" = "both" ]; then
              deploy_pro=true
            fi
          else
            before="$PUSH_BEFORE"
            if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
              before="$(git rev-parse HEAD~1)"
            fi
            if git diff --name-only "$before" HEAD | grep -qx 'community/pubspec.yaml'; then
              deploy_community=true
            fi
            if git diff --name-only "$before" HEAD | grep -qx 'pro/pubspec.yaml'; then
              deploy_pro=true
            fi
          fi
          if [ "$deploy_community" != "true" ] && [ "$deploy_pro" != "true" ]; then
            echo "::error::No app selected: the push did not bump a pubspec version and no dispatch app was chosen."
            exit 1
          fi

          read_version() {
            grep '^version:' "$1/pubspec.yaml" | head -1 | awk '{print $2}'
          }
          community_version="$(read_version community)"
          pro_version="$(read_version pro)"
          if [ -z "$community_version" ] || [ -z "$pro_version" ]; then
            echo "::error::Unable to read versions from the app pubspecs."
            exit 1
          fi

          {
            echo "sha=$candidate_sha"
            echo "community=$deploy_community"
            echo "pro=$deploy_pro"
            echo "community_version=$community_version"
            echo "pro_version=$pro_version"
          } >> "$GITHUB_OUTPUT"
          echo "Selected apps: community=$deploy_community ($community_version), pro=$deploy_pro ($pro_version)"

  ci-gate:
    name: Require green CI for the exact SHA
    needs: resolve
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify ci.yml success for the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$EXPECTED_SHA&status=completed&per_page=1")"
          total="$(jq -r '.total_count' <<<"$runs_json")"
          conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$runs_json")"
          if [ "$total" = "0" ]; then
            echo "::error::No completed ci.yml run found for $EXPECTED_SHA. ci.yml is manual/scheduled in this repo: trigger it for main and wait for success before deploying."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::Latest completed ci.yml run for $EXPECTED_SHA concluded '$conclusion' (success required)."
            exit 1
          fi
          echo "ci.yml is green for $EXPECTED_SHA."

  android-community:
    name: Community — build signed AAB + publish to Play production
    needs: [resolve, ci-gate]
    if: needs.resolve.outputs.community == 'true'
    runs-on: [self-hosted, ci-runner-node, build-heavy]
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: store-deploy-community-android
      cancel-in-progress: false
    defaults:
      run:
        working-directory: community
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FORMULAE_COMMUNITY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::FORMULAE_COMMUNITY_ANDROID_KEYSTORE_BASE64 secret is required for Android release builds."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEY_ALIAS: ${{ secrets.FORMULAE_COMMUNITY_ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.FORMULAE_COMMUNITY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FORMULAE_COMMUNITY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::FORMULAE_COMMUNITY_ANDROID_$name secret is required for Android release builds."
              exit 1
            fi
          done
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          storeType=JKS
          EOF

      - name: Validate Android signing key
        env:
          KEY_ALIAS: ${{ secrets.FORMULAE_COMMUNITY_ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.FORMULAE_COMMUNITY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FORMULAE_COMMUNITY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -storepass:env STORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          printf 'signing validation\n' > "$tmp_dir/payload.txt"
          (cd "$tmp_dir" && jar cf unsigned.jar payload.txt)
          jarsigner \
            -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -storepass:env STORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -signedjar "$tmp_dir/signed.jar" \
            "$tmp_dir/unsigned.jar" \
            "$KEY_ALIAS" >/dev/null

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: false

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android SDK command-line tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -qo /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm /tmp/cmdline-tools.zip
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Configure Flutter for Android
        run: |
          flutter config --android-sdk "$HOME/android-sdk" 2>/dev/null || true
          flutter precache --android 2>/dev/null || true

      - name: Install dependencies (path-dep package)
        working-directory: community/packages/formulaeapps_bff_client
        run: flutter pub get --enforce-lockfile

      - name: Install dependencies (app) and verify locks untouched
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock packages/formulaeapps_bff_client/pubspec.lock

      - name: Verify AdMob Android app id
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          if ! [[ "$ADMOB_ANDROID_APP_ID" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]] || \
             [ "$ADMOB_ANDROID_APP_ID" = "ca-app-pub-3940256099942544~3347511713" ]; then
            echo "::error::FORMULAE_COMMUNITY_ADMOB_ANDROID_APP_ID must be the real, non-test AdMob application id (ca-app-pub-<16 digits>~<10 digits>); the release build fails without it."
            exit 1
          fi

      - name: Build signed AppBundle
        env:
          ORG_GRADLE_PROJECT_ADMOB_ANDROID_APP_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_ANDROID_APP_ID }}
          ADMOB_ENABLED: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_ENABLED }}
          ADMOB_ANDROID_BANNER_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_ANDROID_BANNER_ID }}
          ADMOB_IOS_BANNER_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_IOS_BANNER_ID }}
          ADMOB_ANDROID_INTERSTITIAL_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_ANDROID_INTERSTITIAL_ID }}
          ADMOB_IOS_INTERSTITIAL_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_IOS_INTERSTITIAL_ID }}
          ADMOB_ANDROID_APP_OPEN_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_ANDROID_APP_OPEN_ID }}
          ADMOB_IOS_APP_OPEN_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_IOS_APP_OPEN_ID }}
        run: |
          set -euo pipefail
          define_args=()
          if [ "$ADMOB_ENABLED" = "true" ]; then
            for var_name in \
              ADMOB_ANDROID_BANNER_ID ADMOB_IOS_BANNER_ID \
              ADMOB_ANDROID_INTERSTITIAL_ID ADMOB_IOS_INTERSTITIAL_ID \
              ADMOB_ANDROID_APP_OPEN_ID ADMOB_IOS_APP_OPEN_ID; do
              if [ -z "${!var_name}" ]; then
                echo "::error::FORMULAE_COMMUNITY_$var_name secret is required when FORMULAE_COMMUNITY_ADMOB_ENABLED is 'true'."
                exit 1
              fi
              define_args+=(--dart-define="$var_name=${!var_name}")
            done
            define_args+=(--dart-define=ADMOB_ENABLED=true)
          else
            echo "::warning::FORMULAE_COMMUNITY_ADMOB_ENABLED is not 'true'; building community with ads disabled."
          fi
          flutter build appbundle --release ${define_args[@]+"${define_args[@]}"}

      - name: Stage release artifact with fleet naming
        env:
          APP_VERSION: ${{ needs.resolve.outputs.community_version }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          short_sha="${RESOLVED_SHA:0:7}"
          cp build/app/outputs/bundle/release/app-release.aab \
            "formulae-community-${APP_VERSION}-${short_sha}.aab"

      - name: Upload AppBundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formulae-community-android-${{ needs.resolve.outputs.community_version }}
          path: community/formulae-community-${{ needs.resolve.outputs.community_version }}-*.aab
          retention-days: 30

      - name: Set up Ruby
        uses: ruby/setup-ruby@e5517072e87f198d9533967ae13d97c11b604005 # v1.99.0
        with:
          working-directory: community/android
          bundler-cache: true

      - name: Publish AAB to Play production track
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        working-directory: community/android
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is required to publish to the Play production track."
            exit 1
          fi
          bundle exec fastlane android deploy_production

      - name: Stop Gradle daemons and remove Android release material
        if: always()
        timeout-minutes: 5
        run: |
          set -uo pipefail
          cleanup_status=0
          rm -f \
            android/app/upload-keystore.jks \
            android/key.properties || cleanup_status=$?
          if [ -x android/gradlew ]; then
            (cd android && ./gradlew --stop) || cleanup_status=$?
          fi
          exit "$cleanup_status"

  android-pro:
    name: Pro — build signed AAB + publish to Play production
    needs: [resolve, ci-gate]
    if: needs.resolve.outputs.pro == 'true'
    runs-on: [self-hosted, ci-runner-node, build-heavy]
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: store-deploy-pro-android
      cancel-in-progress: false
    defaults:
      run:
        working-directory: pro
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FORMULAE_PRO_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::FORMULAE_PRO_ANDROID_KEYSTORE_BASE64 secret is required for Android release builds."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEY_ALIAS: ${{ secrets.FORMULAE_PRO_ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.FORMULAE_PRO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FORMULAE_PRO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::FORMULAE_PRO_ANDROID_$name secret is required for Android release builds."
              exit 1
            fi
          done
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          storeType=JKS
          EOF

      - name: Validate Android signing key
        env:
          KEY_ALIAS: ${{ secrets.FORMULAE_PRO_ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.FORMULAE_PRO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FORMULAE_PRO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -storepass:env STORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          printf 'signing validation\n' > "$tmp_dir/payload.txt"
          (cd "$tmp_dir" && jar cf unsigned.jar payload.txt)
          jarsigner \
            -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -storepass:env STORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -signedjar "$tmp_dir/signed.jar" \
            "$tmp_dir/unsigned.jar" \
            "$KEY_ALIAS" >/dev/null

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: false

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android SDK command-line tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -qo /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm /tmp/cmdline-tools.zip
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Configure Flutter for Android
        run: |
          flutter config --android-sdk "$HOME/android-sdk" 2>/dev/null || true
          flutter precache --android 2>/dev/null || true

      - name: Install dependencies (path-dep package)
        working-directory: pro/packages/formulaeapps_bff_client
        run: flutter pub get --enforce-lockfile

      - name: Install dependencies (app) and verify locks untouched
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock packages/formulaeapps_bff_client/pubspec.lock

      - name: Build signed AppBundle (pro flavor)
        run: |
          set -euo pipefail
          flutter build appbundle --release --flavor pro

      - name: Stage release artifact with fleet naming
        env:
          APP_VERSION: ${{ needs.resolve.outputs.pro_version }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          short_sha="${RESOLVED_SHA:0:7}"
          cp build/app/outputs/bundle/proRelease/app-pro-release.aab \
            "formulae-pro-${APP_VERSION}-${short_sha}.aab"

      - name: Upload AppBundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formulae-pro-android-${{ needs.resolve.outputs.pro_version }}
          path: pro/formulae-pro-${{ needs.resolve.outputs.pro_version }}-*.aab
          retention-days: 30

      - name: Set up Ruby
        uses: ruby/setup-ruby@e5517072e87f198d9533967ae13d97c11b604005 # v1.99.0
        with:
          working-directory: pro/android
          bundler-cache: true

      - name: Publish AAB to Play production track
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        working-directory: pro/android
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is required to publish to the Play production track."
            exit 1
          fi
          bundle exec fastlane android deploy_production

      - name: Stop Gradle daemons and remove Android release material
        if: always()
        timeout-minutes: 5
        run: |
          set -uo pipefail
          cleanup_status=0
          rm -f \
            android/app/upload-keystore.jks \
            android/key.properties || cleanup_status=$?
          if [ -x android/gradlew ]; then
            (cd android && ./gradlew --stop) || cleanup_status=$?
          fi
          exit "$cleanup_status"

  ios-community:
    name: Community — build signed IPA + submit to App Store review
    needs: [resolve, ci-gate]
    if: needs.resolve.outputs.community == 'true'
    # iOS builds require Xcode + macOS: they stay on GitHub-hosted
    # macos-latest until the fleet provisions a macOS self-hosted runner.
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: store-deploy-community-ios
      cancel-in-progress: false
    defaults:
      run:
        working-directory: community
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: false

      - name: Install dependencies (path-dep package)
        working-directory: community/packages/formulaeapps_bff_client
        run: flutter pub get --enforce-lockfile

      - name: Install dependencies (app) and verify locks untouched
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock packages/formulaeapps_bff_client/pubspec.lock

      - name: Verify iOS signing and AdMob inputs
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          ADMOB_IOS_APP_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_IOS_APP_ID }}
        run: |
          set -euo pipefail
          for name in MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_BASIC_AUTH \
                      APP_STORE_KEY_ID APP_STORE_ISSUER_ID APP_STORE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is required for iOS store deploys."
              exit 1
            fi
          done
          if ! [[ "$ADMOB_IOS_APP_ID" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]] || \
             [ "$ADMOB_IOS_APP_ID" = "ca-app-pub-3940256099942544~1458002511" ]; then
            echo "::error::FORMULAE_COMMUNITY_ADMOB_IOS_APP_ID must be the real, non-test AdMob application id (ca-app-pub-<16 digits>~<10 digits>); the release archive fails without it."
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@e5517072e87f198d9533967ae13d97c11b604005 # v1.99.0
        with:
          working-directory: community/ios
          bundler-cache: true

      - name: Install signing assets with match
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
        working-directory: community/ios
        run: |
          set -euo pipefail
          bundle exec fastlane ios certificates

      - name: Write AdMob xcconfig for release
        env:
          ADMOB_IOS_APP_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_IOS_APP_ID }}
        working-directory: community/ios
        run: |
          set -euo pipefail
          umask 077
          printf 'ADMOB_IOS_APP_ID=%s\n' "$ADMOB_IOS_APP_ID" > Flutter/AdMob.xcconfig

      - name: Install CocoaPods
        working-directory: community/ios
        run: pod install

      - name: Build signed IPA
        env:
          ADMOB_ENABLED: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_ENABLED }}
          ADMOB_ANDROID_BANNER_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_ANDROID_BANNER_ID }}
          ADMOB_IOS_BANNER_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_IOS_BANNER_ID }}
          ADMOB_ANDROID_INTERSTITIAL_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_ANDROID_INTERSTITIAL_ID }}
          ADMOB_IOS_INTERSTITIAL_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_IOS_INTERSTITIAL_ID }}
          ADMOB_ANDROID_APP_OPEN_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_ANDROID_APP_OPEN_ID }}
          ADMOB_IOS_APP_OPEN_ID: ${{ secrets.FORMULAE_COMMUNITY_ADMOB_IOS_APP_OPEN_ID }}
        run: |
          set -euo pipefail
          define_args=()
          if [ "$ADMOB_ENABLED" = "true" ]; then
            for var_name in \
              ADMOB_ANDROID_BANNER_ID ADMOB_IOS_BANNER_ID \
              ADMOB_ANDROID_INTERSTITIAL_ID ADMOB_IOS_INTERSTITIAL_ID \
              ADMOB_ANDROID_APP_OPEN_ID ADMOB_IOS_APP_OPEN_ID; do
              if [ -z "${!var_name}" ]; then
                echo "::error::FORMULAE_COMMUNITY_$var_name secret is required when FORMULAE_COMMUNITY_ADMOB_ENABLED is 'true'."
                exit 1
              fi
              define_args+=(--dart-define="$var_name=${!var_name}")
            done
            define_args+=(--dart-define=ADMOB_ENABLED=true)
          else
            echo "::warning::FORMULAE_COMMUNITY_ADMOB_ENABLED is not 'true'; building community with ads disabled."
          fi
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            ${define_args[@]+"${define_args[@]}"}

      - name: Stage release artifact with fleet naming
        env:
          APP_VERSION: ${{ needs.resolve.outputs.community_version }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          short_sha="${RESOLVED_SHA:0:7}"
          ipa_file="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          if [ -z "$ipa_file" ]; then
            echo "::error::No IPA produced under build/ios/ipa."
            exit 1
          fi
          cp "$ipa_file" "formulae-community-${APP_VERSION}-${short_sha}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formulae-community-ios-${{ needs.resolve.outputs.community_version }}
          path: community/formulae-community-${{ needs.resolve.outputs.community_version }}-*.ipa
          retention-days: 30

      - name: Submit to App Store with automatic release
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        working-directory: community/ios
        run: |
          set -euo pipefail
          bundle exec fastlane ios deploy_appstore

      - name: Remove iOS release material
        if: always()
        working-directory: community/ios
        run: |
          rm -f Flutter/AdMob.xcconfig

