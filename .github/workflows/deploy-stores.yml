  summary:
    name: Store deploy summary
    needs: [resolve, android-community, android-pro, ios-community, ios-pro]
    if: always() && needs.resolve.result == 'success'
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write store deploy summary
        env:
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
          DEPLOY_COMMUNITY: ${{ needs.resolve.outputs.community }}
          DEPLOY_PRO: ${{ needs.resolve.outputs.pro }}
          COMMUNITY_VERSION: ${{ needs.resolve.outputs.community_version }}
          PRO_VERSION: ${{ needs.resolve.outputs.pro_version }}
          ANDROID_COMMUNITY_RESULT: ${{ needs.android-community.result }}
          ANDROID_PRO_RESULT: ${{ needs.android-pro.result }}
          IOS_COMMUNITY_RESULT: ${{ needs.ios-community.result }}
          IOS_PRO_RESULT: ${{ needs.ios-pro.result }}
        run: |
          set -euo pipefail
          fail=0
          {
            echo "## Store deploy"
            echo
            echo "- SHA: \`$RESOLVED_SHA\`"
            if [ "$DEPLOY_COMMUNITY" = "true" ]; then
              echo "- Formulae Community $COMMUNITY_VERSION:"
              echo "  - Android, Play production track: **$ANDROID_COMMUNITY_RESULT**"
              echo "  - iOS, App Store submit + automatic release: **$IOS_COMMUNITY_RESULT**"
            fi
            if [ "$DEPLOY_PRO" = "true" ]; then
              echo "- Formulae Pro $PRO_VERSION:"
              echo "  - Android, Play production track: **$ANDROID_PRO_RESULT**"
              echo "  - iOS, App Store submit + automatic release: **$IOS_PRO_RESULT**"
            fi
            echo "- Play Console: https://play.google.com/console"
            echo "- App Store Connect: https://appstoreconnect.apple.com"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOY_COMMUNITY" = "true" ]; then
            if [ "$ANDROID_COMMUNITY_RESULT" != "success" ] || [ "$IOS_COMMUNITY_RESULT" != "success" ]; then
              fail=1
            fi
          fi
          if [ "$DEPLOY_PRO" = "true" ]; then
            if [ "$ANDROID_PRO_RESULT" != "success" ] || [ "$IOS_PRO_RESULT" != "success" ]; then
              fail=1
            fi
          fi
          if [ "$fail" != "0" ]; then
            echo "::error::Store deploy finished with platform failures (see summary)."
            exit 1
          fi
