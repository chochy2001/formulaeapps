name: Retired Store Deploy (public mirror disabled)

# Public mirror policy as of 2026-09-03:
# store signing and publication require private credentials and protected
# release controls. This retained filename fails closed on a hosted runner so
# the public mirror cannot build, sign, or publish mobile releases.

on:
  workflow_dispatch:

concurrency:
  group: formulaeapps-store-autodeploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  disabled:
    name: Public mirror store deploy disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed
        run: |
          echo "::error::Public formulaeapps mirror does not run store release automation."
          echo "::error::Keep signing material, store credentials, and publication workflows in the private CAPDESIS/formulaeapps repository."
          exit 1
