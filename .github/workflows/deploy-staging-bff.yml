# FormulaeApps BFF — staging deploy + JWT migration smokes (draft)
#
# Targets staging-node over SSH. Does NOT deploy production.
# Required GitHub secrets in the `staging` environment:
#   STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY, STAGING_SSH_KNOWN_HOSTS
# Optional: STAGING_SSH_PORT (default 2222)
# Optional repository variable: STAGING_APP_PATH (default /opt/staging/apps/formulaeapps)
#
# Host must provide persistent .env.staging outside immutable releases and
# /etc/capdesis-role in {staging, staging-node}. The workflow checks presence/format only.

name: Deploy Staging BFF (JWT)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Full SHA on main to deploy (immutable artifact)'
        required: true
        type: string
      legacy_verify_start:
        description: 'JWT_LEGACY_VERIFY_START (absolute UTC ISO-8601)'
        required: true
        type: string
      legacy_verify_cutoff:
        description: 'JWT_LEGACY_VERIFY_CUTOFF (absolute UTC ISO-8601, max 20m for staging job)'
        required: true
        type: string
      rollback:
        description: 'Validate candidate as rollback artifact'
        required: false
        type: boolean
        default: false
      keep_signing_secret:
        description: 'Confirm rollback retains JWT_SIGNING_SECRET'
        required: false
        type: boolean
        default: false

concurrency:
  group: formulaeapps-deploy-staging-bff
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STAGING_LEGACY_MAX_MS: '1200000'

jobs:
  preflight:
    name: Preflight (gate + tests + build)
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 20
    outputs:
      candidate_sha: ${{ steps.validate.outputs.candidate_sha }}
      control_sha: ${{ steps.control.outputs.control_sha }}
      app_path: ${{ steps.paths.outputs.app_path }}
      release_path: ${{ steps.paths.outputs.release_path }}
      temp_sync_path: ${{ steps.paths.outputs.temp_sync_path }}
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Record control SHA
        id: control
        run: echo "control_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch origin/main
        run: git fetch origin main --depth=1

      - name: Validate candidate SHA and legacy window
        id: validate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          LEGACY_START: ${{ inputs.legacy_verify_start }}
          LEGACY_CUTOFF: ${{ inputs.legacy_verify_cutoff }}
          STAGING_APP_PATH: ${{ vars.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          candidate="${CANDIDATE_SHA}"
          if ! [[ "$candidate" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character hex SHA"
            exit 1
          fi
          if ! git cat-file -e "${candidate}^{commit}" 2>/dev/null; then
            echo "::error::candidate_sha is not a valid commit"
            exit 1
          fi
          full_sha="$(git rev-parse "${candidate}^{commit}")"
          if ! git merge-base --is-ancestor "$full_sha" origin/main; then
            echo "::error::candidate_sha $full_sha is not contained in origin/main"
            exit 1
          fi
          bash scripts/validate-legacy-window.sh "$LEGACY_START" "$LEGACY_CUTOFF"
          python3 scripts/staging-transport.py deploy "$full_sha" "${STAGING_APP_PATH:-/opt/staging/apps/formulaeapps}" "$LEGACY_START" "$LEGACY_CUTOFF" >/dev/null
          echo "candidate_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "Validated candidate_sha=$full_sha"

      - name: Resolve immutable release paths
        id: paths
        env:
          CANDIDATE_SHA: ${{ steps.validate.outputs.candidate_sha }}
          STAGING_APP_PATH: ${{ vars.STAGING_APP_PATH }}
        run: |
          set -euo pipefail
          payload="$(python3 scripts/staging-transport.py sync "$CANDIDATE_SHA" "${STAGING_APP_PATH:-/opt/staging/apps/formulaeapps}")"
          {
            app_path="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["app_path"])' "$payload")"
            release_path="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["release_path"])' "$payload")"
            temp_sync_path="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["temp_sync_path"])' "$payload")"
            echo "app_path=$app_path"
            echo "release_path=$release_path"
            echo "temp_sync_path=$temp_sync_path"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: JWT dual-key artifact gate
        env:
          CANDIDATE_FULL_SHA: ${{ steps.validate.outputs.candidate_sha }}
          IS_ROLLBACK: ${{ inputs.rollback || false }}
          KEEP_SIGNING_SECRET: ${{ inputs.keep_signing_secret || false }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$IS_ROLLBACK" == 'true' ]]; then
            args+=(--rollback)
          fi
          if [[ "$KEEP_SIGNING_SECRET" == 'true' ]]; then
            args+=(--keep-signing-secret)
          fi
          bash scripts/verify-jwt-release-artifact.sh "$CANDIDATE_FULL_SHA" "${args[@]}"

      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.validate.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Setup Node (required by bunx tsc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: BFF install, typecheck, test, build
        working-directory: bff
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build

  deploy:
    name: SSH deploy + secret presence + smokes
    needs: preflight
    runs-on: [self-hosted, ci-runner-node, deploy-only]
    environment: staging
    timeout-minutes: 45
    steps:
      - name: Checkout control (workflow ref)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Record control SHA
        id: control
        run: echo "control_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Revalidate legacy window at deploy start
        env:
          LEGACY_START: ${{ inputs.legacy_verify_start }}
          LEGACY_CUTOFF: ${{ inputs.legacy_verify_cutoff }}
        run: |
          set -euo pipefail
          bash scripts/validate-legacy-window.sh "$LEGACY_START" "$LEGACY_CUTOFF"
          python3 -c "import os,sys; from pathlib import Path; sys.path.insert(0, str(Path('scripts').resolve())); from staging_lib import validate_deploy_queue_window; validate_deploy_queue_window(os.environ['LEGACY_START'], os.environ['LEGACY_CUTOFF'])"

      - name: Checkout candidate (BFF runtime)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          path: candidate-tree
          fetch-depth: 0

      - name: Compute candidate digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(python3 scripts/staging-transport.py digest "${{ github.workspace }}/candidate-tree" | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Validate staging SSH secrets
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_KEY STAGING_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in staging environment"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Deploy blocked until STAGING_SSH_* secrets exist on CAPDESIS/formulaeapps staging environment."
            exit 1
          fi

      - name: Install SSH key
        id: ssh
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/staging_deploy_key"
          known_hosts_file="$RUNNER_TEMP/staging_known_hosts"
          printf '%s\n' "$STAGING_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts_file=$known_hosts_file" >> "$GITHUB_OUTPUT"

      - name: Upload control scripts to staging host
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          ssh_port="${STAGING_SSH_PORT:-2222}"
          remote_dir="/tmp/formulae-staging-control-${{ needs.preflight.outputs.candidate_sha }}"
          ssh -n -i "$KEY_FILE" -p "$ssh_port" \
            -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$ssh_target" "rm -rf '${remote_dir}' && mkdir -p '${remote_dir}' && chmod 700 '${remote_dir}'"
          scp -i "$KEY_FILE" -P "$ssh_port" \
            -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes \
            scripts/staging_lib.py scripts/staging_sync_remote.py scripts/staging_deploy_remote.py scripts/staging_rollback_remote.py scripts/staging-check-env.py scripts/jwt-staging-smoke.sh \
            "${ssh_target}:${remote_dir}/"
          echo "remote_control_dir=$remote_dir" >> "$GITHUB_ENV"

      - name: Remote pre-sync guards
        id: guard
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          APP_PATH: ${{ needs.preflight.outputs.app_path }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          ssh_port="${STAGING_SSH_PORT:-2222}"
          guard_json="$(python3 scripts/staging-transport.py guard "$CANDIDATE_SHA" "$APP_PATH" "${{ steps.digest.outputs.digest }}")"
          guard_result="$(printf '%s' "$guard_json" | ssh -n -i "$KEY_FILE" -p "$ssh_port" \
            -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$ssh_target" "python3 ${remote_control_dir}/staging_sync_remote.py")"
          echo "$guard_result"
          skip_sync="$(echo "$guard_result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("skip_sync","false"))')"
          echo "skip_sync=$skip_sync" >> "$GITHUB_OUTPUT"

      - name: Sync candidate to temp release directory
        id: sync
        if: steps.guard.outputs.skip_sync != 'true'
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          APP_PATH: ${{ needs.preflight.outputs.app_path }}
          TEMP_SYNC_PATH: ${{ needs.preflight.outputs.temp_sync_path }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          ssh_port="${STAGING_SSH_PORT:-2222}"
          rsync -az \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.staging-state/' \
            --exclude='current' \
            --exclude='releases/' \
            --exclude='pro/' \
            --exclude='community/' \
            --exclude='landing/' \
            -e "ssh -i ${KEY_FILE} -p ${ssh_port} -o UserKnownHostsFile=${KNOWN_HOSTS_FILE} -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./candidate-tree/ "${ssh_target}:${TEMP_SYNC_PATH}/"

      - name: Finalize atomic release directory
        if: steps.guard.outputs.skip_sync != 'true'
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          APP_PATH: ${{ needs.preflight.outputs.app_path }}
          CANDIDATE_DIGEST: ${{ steps.digest.outputs.digest }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          ssh_port="${STAGING_SSH_PORT:-2222}"
          finalize_json="$(python3 scripts/staging-transport.py finalize "$CANDIDATE_SHA" "$APP_PATH" "$CANDIDATE_DIGEST")"
          printf '%s' "$finalize_json" | ssh -n -i "$KEY_FILE" -p "$ssh_port" \
            -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$ssh_target" "python3 ${remote_control_dir}/staging_sync_remote.py"

      - name: Deploy BFF on staging-node
        id: deploy
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          CONTROL_SHA: ${{ steps.control.outputs.control_sha }}
          APP_PATH: ${{ needs.preflight.outputs.app_path }}
          RELEASE_PATH: ${{ needs.preflight.outputs.release_path }}
          LEGACY_START: ${{ inputs.legacy_verify_start }}
          LEGACY_CUTOFF: ${{ inputs.legacy_verify_cutoff }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          ssh_port="${STAGING_SSH_PORT:-2222}"
          deploy_json="$(python3 scripts/staging-transport.py deploy "$CANDIDATE_SHA" "$APP_PATH" "$LEGACY_START" "$LEGACY_CUTOFF" "https://staging.api.formulaeapps.com" "$CONTROL_SHA")"
          printf '%s' "$deploy_json" | ssh -n -i "$KEY_FILE" -p "$ssh_port" \
            -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$ssh_target" "python3 ${remote_control_dir}/staging_deploy_remote.py"

      - name: Verify deployed metadata matches candidate SHA
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          APP_PATH: ${{ needs.preflight.outputs.app_path }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          ssh_port="${STAGING_SSH_PORT:-2222}"
          verify_json="$(python3 -c 'import json,sys; print(json.dumps({"app_path": sys.argv[1], "candidate_sha": sys.argv[2]}))' "$APP_PATH" "$CANDIDATE_SHA")"
          deployed="$(printf '%s' "$verify_json" | ssh -n -i "$KEY_FILE" -p "$ssh_port" -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$ssh_target" "python3 -c 'import json,sys; from pathlib import Path; cfg=json.load(sys.stdin); print((Path(cfg[\"app_path\"])/\"current\"/\"DEPLOYED_SHA\").read_text().strip())'")"
          if [[ "$deployed" != "$CANDIDATE_SHA" ]]; then
            echo "::error::deployed SHA $deployed does not match candidate $CANDIDATE_SHA"
            exit 1
          fi
          echo "Deployed metadata verified: $deployed"

      - name: Check JWT_SIGNING_SECRET presence and format (redacted)
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          APP_PATH: ${{ needs.preflight.outputs.app_path }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          ssh_port="${STAGING_SSH_PORT:-2222}"
          ssh -n -i "$KEY_FILE" -p "$ssh_port" -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$ssh_target" "STAGING_ENV_FILE='${APP_PATH}/current/.env' python3 ${remote_control_dir}/staging-check-env.py"

      - name: JWT staging smokes
        id: smokes
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          APP_PATH: ${{ needs.preflight.outputs.app_path }}
          REMOTE_CONTROL_DIR: /tmp/formulae-staging-control-${{ needs.preflight.outputs.candidate_sha }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          ssh_port="${STAGING_SSH_PORT:-2222}"
          smoke_json="$(python3 -c 'import json, os; print(json.dumps({"env_file": os.environ["APP_PATH"] + "/current/.env", "base_url": "https://staging.api.formulaeapps.com", "control_dir": os.environ["REMOTE_CONTROL_DIR"]}))')"
          printf '%s' "$smoke_json" | ssh -n -i "$KEY_FILE" -p "$ssh_port" \
            -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$ssh_target" "python3 -c 'import json,sys,subprocess,os; cfg=json.load(sys.stdin); subprocess.run([\"bash\", cfg[\"control_dir\"] + \"/jwt-staging-smoke.sh\", cfg[\"base_url\"]], check=True, env={**os.environ, \"STAGING_ENV_FILE\": cfg[\"env_file\"]})'"

      - name: Roll back staging on failure
        if: failure() && steps.deploy.outcome == 'success'
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          APP_PATH: ${{ needs.preflight.outputs.app_path }}
          RELEASE_PATH: ${{ needs.preflight.outputs.release_path }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_target="${STAGING_SSH_USER}@${STAGING_SSH_HOST}"
          ssh_port="${STAGING_SSH_PORT:-2222}"
          rollback_json="$(python3 scripts/staging-transport.py rollback "$APP_PATH" "$CANDIDATE_SHA")"
          printf '%s' "$rollback_json" | ssh -n -i "$KEY_FILE" -p "$ssh_port" \
            -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$ssh_target" "python3 ${remote_control_dir}/staging_rollback_remote.py"

      - name: Clean SSH material
        if: always()
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          rm -f "${KEY_FILE:-}" "${KNOWN_HOSTS_FILE:-}"
