name: Retired Staging BFF (public mirror disabled)

# Public mirror policy as of 2026-09-03:
# staging SSH, Docker, and JWT rollout controls remain private operational
# automation. This retained workflow name exists only to fail closed if someone
# dispatches it from the public mirror.

on:
  workflow_dispatch:

concurrency:
  group: formulaeapps-deploy-staging-bff
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  disabled:
    name: Public mirror staging deploy disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed
        run: |
          echo "::error::Public formulaeapps mirror does not run staging BFF deploys."
          echo "::error::Keep staging SSH, Docker, and rollback automation in the private CAPDESIS/formulaeapps repository."
          exit 1
