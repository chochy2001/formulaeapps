name: gitleaks
on:
  workflow_dispatch:

  schedule:
    # Local-first policy: PR/push validation runs on the developer machine.
    # Remote CI is manual or staggered daily (validation only — no production deploy).
    - cron: '10 8 * * *'
permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    # This public mirror cannot receive jobs on CAPDESIS private runners.
    # Keep the scheduled secret scan independent from on-premise capacity.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.0'
          check-latest: false
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          actual="$(gitleaks version)"
          test "$actual" = "8.30.1" || { echo "::error::gitleaks drift: ${actual:-missing}"; exit 1; }
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --report-format sarif --report-path gitleaks.sarif --exit-code 1
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: gitleaks.sarif
