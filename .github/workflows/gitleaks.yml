name: gitleaks
on:
  workflow_dispatch:

  schedule:
    # Local-first policy: PR/push validation runs on the developer machine.
    # Remote CI is manual or staggered daily (validation only — no production deploy).
    - cron: '10 8 * * *'
permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify preloaded gitleaks
        run: |
          set -euo pipefail
          binary="$(command -v gitleaks || true)"
          test -n "$binary" || { echo "::error::gitleaks 8.30.1 must be preloaded"; exit 1; }
          actual="$("$binary" version | sed -n 's/.*\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -n 1)"
          test "$actual" = "8.30.1" || { echo "::error::gitleaks drift: ${actual:-missing}"; exit 1; }
          echo "Using gitleaks $actual at $binary"
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --report-format sarif --report-path gitleaks.sarif --exit-code 1
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: gitleaks.sarif
