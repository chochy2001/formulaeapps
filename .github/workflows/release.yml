name: Release Gate

# Runs the production-mode infrastructure validator before a release is
# declared green. Per specs/002-formulae-fe-be-sync/tasks.md T126 + Principle IX.
#
# Triggers:
#   - workflow_dispatch (manual, before any release)
#   - push to tags matching v*.* (release tagging)
#
# JWT gate coherence: one candidate_sha is validated end-to-end. The gate
# script always runs from the workflow ref (github.sha), which must already
# contain scripts/verify-jwt-release-artifact.sh. That script inspects the
# candidate's blobs at candidate_sha; behavioral tests and infra validation
# then check out the same candidate_sha.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Artifact commit to validate (defaults to current SHA)'
        required: false
        type: string
      rollback:
        description: 'Validate this candidate as a rollback artifact'
        required: false
        type: boolean
        default: false
      keep_signing_secret:
        description: 'Confirm rollback retains JWT_SIGNING_SECRET'
        required: false
        type: boolean
        default: false
      verbose:
        description: 'Verbose output'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*'

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}

jobs:
  jwt-artifact-validate:
    name: JWT dual-key artifact gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow ref (gate script source)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Block unsafe JWT release or rollback artifacts
        env:
          IS_ROLLBACK: ${{ inputs.rollback || false }}
          KEEP_SIGNING_SECRET: ${{ inputs.keep_signing_secret || false }}
        run: |
          args=()
          if [[ "$IS_ROLLBACK" == 'true' ]]; then
            args+=(--rollback)
          fi
          if [[ "$KEEP_SIGNING_SECRET" == 'true' ]]; then
            args+=(--keep-signing-secret)
          fi
          # Script from workflow ref; candidate blobs inspected via git show.
          bash scripts/verify-jwt-release-artifact.sh "$CANDIDATE_SHA" "${args[@]}"

      - name: Checkout candidate for behavioral suite
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Run JWT behavioral regression suite
        working-directory: bff
        run: |
          bun install --frozen-lockfile
          bun test tests/unit/env.test.ts tests/unit/jwt.test.ts tests/unit/jwt-release-gate.test.ts

  infra-validate-production:
    name: Multi-App Infra Validation (Principle IX)
    needs: jwt-artifact-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout same candidate as JWT gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install BFF deps (infra-validate.ts imports `yaml`)
        run: cd bff && bun install --frozen-lockfile

      - name: Run infra-validate in production mode
        run: |
          set +e
          bash scripts/infra-validate.sh > infra-report.json
          EXIT=$?
          set -e
          echo "::group::Infra validation report"
          cat infra-report.json
          echo "::endgroup::"
          exit $EXIT

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infra-validate-report-${{ env.CANDIDATE_SHA }}
          path: infra-report.json
          retention-days: 90
