name: Retired Web Deploy (public mirror disabled)

# Public mirror policy as of 2026-09-03:
# deployment automation stays in the private CAPDESIS repository. This retained
# filename fails closed on GitHub-hosted infrastructure so accidental manual
# dispatches cannot touch production runners, credentials, or FTPS paths.

on:
  workflow_dispatch:

concurrency:
  group: formulae-web-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  disabled:
    name: Public mirror deploy disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed
        run: |
          echo "::error::Public formulaeapps mirror does not run production web deploys."
          echo "::error::Keep FTPS promotion and credentials in the private CAPDESIS/formulaeapps repository."
          exit 1
