name: Build Web Release Candidate

# This workflow intentionally has no production deploy job. Runs 29265090762
# and 29267520787 both failed before upload and exposed missing release gates or
# runner/configuration blockers. Re-enable deployment only through a separate,
# reviewed promotion workflow with executable staging, smoke, and rollback.

on:
  workflow_dispatch:

concurrency:
  group: formulae-web-release-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Verify exact main
    runs-on: [self-hosted, ci-runner-node, policy-light]
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact main SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          candidate="${GITHUB_SHA}"
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The release candidate must be a full commit SHA."
            exit 1
          fi
          main_sha="$(git rev-parse HEAD)"
          if [ "$candidate" != "$main_sha" ]; then
            echo "::error::The selected workflow ref is not the current origin/main SHA."
            exit 1
          fi
          echo "release_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "::notice::Production deployment is intentionally disabled; this run only builds immutable candidates."

  build-landing:
    name: Build landing
    needs: preflight
    runs-on: [self-hosted, ci-runner-node, test-light]
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9
      - name: Build landing
        working-directory: landing
        env:
          PUBLIC_SITE_URL: https://formulaeapps.com
          PUBLIC_APP_URL: https://app.formulaeapps.com
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test
          bun run build
      - name: Upload landing candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: landing-${{ needs.preflight.outputs.release_sha }}
          path: landing/dist
          retention-days: 14
          if-no-files-found: error

  build-pro-web:
    name: Build Pro web
    needs: preflight
    runs-on: [self-hosted, ci-runner-node, build-heavy]
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.1'
          channel: stable
      - name: Install BFF client dependencies
        working-directory: pro/packages/formulaeapps_bff_client
        run: flutter pub get
      - name: Build Pro web
        working-directory: pro
        env:
          JWT_SHARED_SECRET: ${{ secrets.FORMULAE_JWT_SHARED_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${JWT_SHARED_SECRET:-}" ]; then
            echo "::error::Missing repository secret FORMULAE_JWT_SHARED_SECRET"
            exit 1
          fi
          bash build_web.sh --base-href "/" --no-source-maps --no-web-resources-cdn
      - name: Verify build output
        working-directory: pro
        run: |
          test -f build/web/index.html
          grep -q '<base href="/">' build/web/index.html
          test -f build/web/main.dart.js
      - name: Upload Pro web candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pro-web-${{ needs.preflight.outputs.release_sha }}
          path: pro/build/web
          retention-days: 14
          if-no-files-found: error
