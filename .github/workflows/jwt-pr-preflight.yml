name: JWT PR Preflight

# Lightweight PR gate for JWT migration and staging deploy hardening.
# Excludes Flutter/Docker/heavy builds — those stay on CI workflow.

on:
  pull_request:
    paths:
      - 'bff/**'
      - 'scripts/**'
      - 'docs/JWT_STAGING_RUNBOOK.md'
      - 'docker-compose.staging.yml'
      - '.gitleaks.toml'
      - '.github/workflows/jwt-pr-preflight.yml'
      - '.github/workflows/deploy-staging-bff.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STAGING_LEGACY_MAX_MS: '1200000'

concurrency:
  group: jwt-pr-preflight-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jwt-preflight:
    name: JWT light preflight (no secrets)
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node (required by bunx tsc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9
          no-cache: true

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.0"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          wget -q "${BASE_URL}/${TARBALL}"
          wget -q "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing --check "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar xzf "${TARBALL}" gitleaks
          chmod +x gitleaks
          rm "${TARBALL}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          ./gitleaks version

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          SHELLCHECK_VERSION="0.10.0"
          TARBALL="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          EXPECTED_SHA256="6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
          BASE_URL="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}"
          wget -q "${BASE_URL}/${TARBALL}"
          echo "${EXPECTED_SHA256}  ${TARBALL}" | sha256sum --check
          tar xJf "${TARBALL}"
          mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" ./shellcheck
          chmod +x shellcheck
          rm -rf "shellcheck-v${SHELLCHECK_VERSION}" "${TARBALL}"
          ./shellcheck --version

      - name: Python compile + staging helper tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/staging_lib.py scripts/staging-transport.py scripts/staging_deploy_remote.py scripts/staging_rollback_remote.py scripts/staging_sync_remote.py scripts/staging-check-env.py
          python3 scripts/test_staging_lib.py

      - name: Shellcheck staging scripts
        run: |
          set -euo pipefail
          ./shellcheck -x scripts/staging-deploy-remote.sh scripts/staging-rollback-remote.sh scripts/staging-sync-release.sh scripts/jwt-staging-smoke.sh scripts/validate-legacy-window.sh

      - name: Docker compose config (synthetic)
        env:
          CANDIDATE_SHA: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
        run: |
          set -euo pipefail
          : > .env
          docker compose -f docker-compose.staging.yml config >/dev/null

      - name: Frozen install
        working-directory: bff
        run: bun install --frozen-lockfile

      - name: BFF suite
        working-directory: bff
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/gitleaks
          SHELLCHECK_BIN: ${{ github.workspace }}/shellcheck
        run: bun test

      - name: Typecheck
        working-directory: bff
        run: bun run typecheck

      - name: JWT release-artifact gate (HEAD)
        run: bash scripts/verify-jwt-release-artifact.sh "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Gitleaks (history + worktree)
        run: |
          set -euo pipefail
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1
          ./gitleaks dir --redact --no-banner --config .gitleaks.toml --exit-code 1 .

      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
