name: JWT PR Preflight

# Lightweight, secret-free PR gate for the dual-key JWT migration.
# Intentionally excludes Flutter/Docker/heavy builds — those stay on the
# scheduled/manual CI workflow.

on:
  pull_request:
    paths:
      - 'bff/**'
      - 'scripts/verify-jwt-release-artifact.sh'
      - '.gitleaks.toml'
      - '.github/workflows/jwt-pr-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: jwt-pr-preflight-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jwt-preflight:
    name: JWT light preflight (no secrets)
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 15
    steps:
      # Pin by full commit SHA (not floating tags).
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node (required by bunx tsc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9
          no-cache: true

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # [[allowlists]] / targetRules require gitleaks >= 8.25.0
          GITLEAKS_VERSION="8.30.0"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          wget -q "${BASE_URL}/${TARBALL}"
          wget -q "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing --check "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar xzf "${TARBALL}" gitleaks
          chmod +x gitleaks
          rm "${TARBALL}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          ./gitleaks version

      - name: Frozen install
        working-directory: bff
        run: bun install --frozen-lockfile

      - name: BFF suite
        working-directory: bff
        env:
          GITLEAKS_BIN: ${{ github.workspace }}/gitleaks
        run: bun test

      - name: Typecheck
        working-directory: bff
        run: bun run typecheck

      - name: JWT release-artifact gate (HEAD)
        run: bash scripts/verify-jwt-release-artifact.sh "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Gitleaks (history + worktree)
        run: |
          set -euo pipefail
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1
          ./gitleaks dir --redact --no-banner --config .gitleaks.toml --exit-code 1 .

      - name: Diff check
        run: git diff --check
