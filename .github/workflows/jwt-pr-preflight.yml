name: JWT PR Preflight

# Lightweight PR gate for JWT migration and staging deploy hardening.
# Excludes Flutter/Docker/heavy builds — those stay on CI workflow.

on:
  pull_request:
    paths:
      - 'bff/**'
      - 'scripts/**'
      - 'docs/JWT_STAGING_RUNBOOK.md'
      - 'docker-compose.staging.yml'
      - '.gitleaks.toml'
      - '.github/workflows/jwt-pr-preflight.yml'
      - '.github/workflows/deploy-staging-bff.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STAGING_LEGACY_MAX_MS: '1200000'

concurrency:
  group: jwt-pr-preflight-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jwt-preflight:
    name: JWT light preflight (no secrets)
    # Public mirror policy: every JWT preflight path stays on GitHub-hosted
    # runners so branch code never reaches CAPDESIS private lanes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node (required by bunx tsc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Verify installed Bun
        run: bash scripts/ci-ensure-bun.sh 1.3.14 --verify-only

      - name: Install pinned tools on hosted worker
        run: bash scripts/ci-ensure-jwt-tools.sh

      - name: Python compile + staging helper tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/staging_lib.py scripts/staging-transport.py scripts/staging_deploy_remote.py scripts/staging_rollback_remote.py scripts/staging_sync_remote.py scripts/staging-check-env.py
          python3 scripts/test_staging_lib.py

      - name: Shellcheck staging scripts
        run: |
          set -euo pipefail
          shellcheck -x scripts/staging-deploy-remote.sh scripts/staging-rollback-remote.sh scripts/staging-sync-release.sh scripts/jwt-staging-smoke.sh scripts/validate-legacy-window.sh

      - name: Frozen install
        working-directory: bff
        run: bun install --frozen-lockfile

      - name: BFF suite
        working-directory: bff
        env:
          GITLEAKS_BIN: gitleaks
          SHELLCHECK_BIN: shellcheck
        run: bun test

      - name: Typecheck
        working-directory: bff
        run: bun run typecheck

      - name: JWT release-artifact gate (HEAD)
        run: bash scripts/verify-jwt-release-artifact.sh "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Gitleaks (history + worktree)
        run: |
          set -euo pipefail
          gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1
          gitleaks dir --redact --no-banner --config .gitleaks.toml --exit-code 1 .

      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

  compose-config:
    name: Staging Compose config
    # Keep the synthetic Compose render on a hosted worker; this public mirror
    # must not depend on private Docker-capable runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Docker compose config (synthetic)
        env:
          CANDIDATE_SHA: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
        run: |
          set -euo pipefail
          : > .env
          docker compose -f docker-compose.staging.yml config >/dev/null
