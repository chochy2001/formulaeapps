name: CI

on:
  workflow_dispatch:
  schedule:
    # Local-first policy: PR/push validation runs on the developer machine.
    # Remote CI is manual or staggered daily (validation only — no production deploy).
    - cron: '10 8 * * *'
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Constitution gates:
#   - Principle VI  (Backend↔FE Route Coverage): verify-routes job below.
#   - Principle VII (Model Parity):              verify-parity job below.
#   - Principle VIII (Build Integrity):          bff-test + pro-test + community-test jobs below.
#   - Principle IX  (Multi-App Infra):           infra-validate job added in US5 T126
#                                                under .github/workflows/release.yml.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bff-test:
    name: BFF — typecheck + test
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bff
    steps:
      # Full history: the JWT release-artifact gate test (bun test) inspects the
      # canonical dual-key squash commit and its main-lineage ancestors via
      # git ancestry checks. A shallow (default depth-1) checkout omits those
      # objects, so the gate exits early with "candidate must identify a local
      # Git commit". Mirror the fetch-depth used by jwt-pr-preflight/release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node (required by bunx tsc)
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
          no-cache: true
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit + integration tests
        run: bun test

  verify-parity:
    name: Contract ↔ Dart parity (Principle VII)
    runs-on: [self-hosted, ci-runner-node, build-heavy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
          no-cache: true
      - name: Setup Node (bunx/tsc on self-hosted runners)
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Setup Java (required by openapi-generator-cli)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install BFF deps
        run: cd bff && bun install --frozen-lockfile
      - name: Re-export OpenAPI + regenerate Dart + diff
        run: bash scripts/verify-parity.sh

  verify-routes:
    name: Backend ↔ FE route coverage (Principle VI)
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
          no-cache: true
      - name: Setup Node (bunx/tsc on self-hosted runners)
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Install BFF deps (route-coverage.ts imports `yaml`)
        run: cd bff && bun install --frozen-lockfile
      - name: Scan for orphan routes / dead calls
        run: |
          set +e
          bash scripts/route-coverage.sh > coverage.json
          EXIT=$?
          set -e
          cat coverage.json
          exit $EXIT
      - name: Upload coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-coverage-report
          path: coverage.json
          retention-days: 30

  # Flutter analyze+test is CPU/RAM heavy. Keep Pro and Community on build-heavy
  # and serialize Community after Pro so parallel suites cannot starve the shared
  # host (recent main failures: runner lost communication mid-test while analyze
  # had already passed).
  pro-test:
    name: Pro — flutter analyze + test (Principle VIII)
    runs-on: [self-hosted, ci-runner-node, build-heavy]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pro
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: false
      # Path-dep package (packages/formulaeapps_bff_client) must pub-get first so
      # built_value transitive deps + .g.dart files resolve before main pub get.
      - name: pub get path-dep package
        working-directory: pro/packages/formulaeapps_bff_client
        run: flutter pub get
      - name: pub get main app
        run: flutter pub get
      # Pro analyzer is clean with fatal-infos after fix/pro-analyzer-post-37
      # (super-parameters, IAP direct dep, visibleForTesting UI callers).
      - name: analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      # JWT_SHARED_SECRET is a compile-time const String.fromEnvironment in
      # lib/chat_gpt/api_consts.dart (defaults to ''); the auth_service tests
      # exercise the real token-minting path and require a non-empty value via
      # --dart-define, mirroring pro/Dockerfile and pro/build_web.sh. The value
      # here is a non-secret CI test constant that only gates these unit tests.
      - name: test
        run: |
          FLUTTER_TEST_CONCURRENCY=1 flutter test --no-pub --reporter compact \
            --dart-define=JWT_SHARED_SECRET=test-shared-secret \
            --dart-define=FORMULAE_BUILD_NONCE=ci-test-build-nonce \
            --dart-define=FORMULAE_APP_VERSION=0.0.0-ci
      - name: BFF client contract tests
        working-directory: pro/packages/formulaeapps_bff_client
        run: |
          flutter pub get
          dart test

  community-test:
    name: Community — flutter analyze + test (Principle VIII)
    needs: [pro-test]
    runs-on: [self-hosted, ci-runner-node, build-heavy]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: community
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: false
      - name: pub get path-dep package
        working-directory: community/packages/formulaeapps_bff_client
        run: flutter pub get
      - name: pub get main app
        run: flutter pub get
      - name: analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      # Same dart-defines as pro-test: auth minting path needs JWT_SHARED_SECRET.
      - name: test
        run: |
          FLUTTER_TEST_CONCURRENCY=1 flutter test --no-pub --reporter compact \
            --dart-define=JWT_SHARED_SECRET=test-shared-secret \
            --dart-define=FORMULAE_BUILD_NONCE=ci-test-build-nonce \
            --dart-define=FORMULAE_APP_VERSION=0.0.0-ci
      - name: BFF client contract tests
        working-directory: community/packages/formulaeapps_bff_client
        run: |
          flutter pub get
          dart test

  landing-test:
    name: Landing — vitest (Principle VIII)
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      # Astro 6 `astro check` requires Node >=22.12; the runner default is Node 20.
      - name: Setup Node (required by astro check)
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
          no-cache: true
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Validate canonical Formulae images
        run: bun run check:formulae-images
      - name: Build
        run: bun run build
