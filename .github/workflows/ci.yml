name: CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run normal CI or reconcile the WSL Bun preload
        required: false
        default: ci
        type: choice
        options:
          - ci
          - preload-wsl-bun
  schedule:
    # Local-first policy: PR/push validation runs on the developer machine.
    # Remote CI is manual or staggered daily (validation only — no production deploy).
    - cron: '10 8 * * *'
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Prefer warm toolcache on ci-runner-node (fleet 54). Node 24.x is not yet
  # preloaded under shared `_work/_tool` and setup-node mkdir of 24.18.0 hit
  # EACCES on test-light (2026-07-22). Pin the known-warm patch until ops
  # preloads Node 24 or fixes `_tool` ownership; JS actions still use Node 24
  # via FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 above.
  NODE_VERSION: '22.22.3'

# Constitution gates:
#   - Principle VI  (Backend↔FE Route Coverage): verify-routes job below.
#   - Principle VII (Model Parity):              verify-parity job below.
#   - Principle VIII (Build Integrity):          bff-test + pro-test + community-test jobs below.
#   - Principle IX  (Multi-App Infra):           infra-validate job added in US5 T126
#                                                under .github/workflows/release.yml.
#
# Line coverage (soft report): pro / community / bff / landing collect LCOV,
# print RAW LF/LH % to the job summary, and upload artifacts. No hard 85% gate
# until runner-confirmed floors are recorded (honest denominator; no exclusions
# of under-test production code to fake-green).

concurrency:
  # Keep normal remasure and short preload maintenance in separate groups so
  # one cannot cancel or serialize the other. Repeated normal remasures still
  # queue rather than killing long Flutter coverage jobs.
  group: ci-${{ github.ref }}-${{ inputs.mode || 'ci' }}
  cancel-in-progress: false

jobs:
  preload-wsl-bun:
    name: Preload WSL Bun 1.3.14
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preload-wsl-bun'
    runs-on: [self-hosted, Linux, X64, pc-escritorio, ci-flutter-fast]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile checksum-locked Bun outside product CI
        run: bash scripts/ci-ensure-bun.sh 1.3.14

  bff-test:
    name: BFF — typecheck + test
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'preload-wsl-bun'
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bff
    steps:
      # Full history: the JWT release-artifact gate test (bun test) inspects the
      # canonical dual-key squash commit and its main-lineage ancestors via
      # git ancestry checks. A shallow (default depth-1) checkout omits those
      # objects, so the gate exits early with "candidate must identify a local
      # Git commit". Mirror the fetch-depth used by jwt-pr-preflight/release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node (required by bunx tsc)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ensure Bun 1.3.14
        working-directory: .
        run: bash scripts/ci-ensure-bun.sh 1.3.14 --verify-only
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # Soft-report: last fleet measure was 93.54% on src/ (2026-07-03); suite
      # grew — remasure here, do not hard-gate until runner confirms a floor.
      - name: Unit + integration tests (with coverage)
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - name: Summarize BFF line coverage (soft report)
        if: always()
        working-directory: .
        run: bash scripts/coverage-summary.sh bff/coverage/lcov.info "BFF"
      - name: Upload BFF lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bff-lcov
          path: bff/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30

  verify-parity:
    name: Contract ↔ Dart parity (Principle VII)
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'preload-wsl-bun'
    # OpenAPI regen + Dart diff (Java). Not APK/Docker — stay on test-light so
    # CI is not blocked when the dedicated build-heavy runner is offline.
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Bun 1.3.14
        run: bash scripts/ci-ensure-bun.sh 1.3.14 --verify-only
      - name: Setup Node (bunx/tsc on self-hosted runners)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Java (required by openapi-generator-cli)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install BFF deps
        run: cd bff && bun install --frozen-lockfile
      - name: Re-export OpenAPI + regenerate Dart + diff
        run: bash scripts/verify-parity.sh

  verify-routes:
    name: Backend ↔ FE route coverage (Principle VI)
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'preload-wsl-bun'
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Bun 1.3.14
        run: bash scripts/ci-ensure-bun.sh 1.3.14 --verify-only
      - name: Setup Node (bunx/tsc on self-hosted runners)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install BFF deps (route-coverage.ts imports `yaml`)
        run: cd bff && bun install --frozen-lockfile
      - name: Scan for orphan routes / dead calls
        run: |
          set +e
          bash scripts/route-coverage.sh > coverage.json
          EXIT=$?
          set -e
          cat coverage.json
          exit $EXIT
      - name: Upload coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-coverage-report
          path: coverage.json
          retention-days: 30

  # Flutter analyze+test+coverage on test-light so remasure is not blocked when
  # the dedicated build-heavy runner is offline (2026-07-21 queue stall; mirrors
  # FormulaeCommunity). Serialize Community after Pro so parallel Flutter suites
  # cannot starve the shared test-light host. APK/Docker stays on build-heavy
  # in deploy/store workflows.
  pro-test:
    name: Pro — flutter analyze + test (Principle VIII)
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'preload-wsl-bun'
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 55
    defaults:
      run:
        working-directory: pro
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: false
      # Path-dep package (packages/formulaeapps_bff_client) must pub-get first so
      # built_value transitive deps + .g.dart files resolve before main pub get.
      - name: pub get path-dep package
        working-directory: pro/packages/formulaeapps_bff_client
        run: flutter pub get
      - name: pub get main app
        run: flutter pub get
      # Pro analyzer is clean with fatal-infos after fix/pro-analyzer-post-37
      # (super-parameters, IAP direct dep, visibleForTesting UI callers).
      - name: analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      # JWT_SHARED_SECRET is a compile-time const String.fromEnvironment in
      # lib/chat_gpt/api_consts.dart (defaults to ''); the auth_service tests
      # exercise the real token-minting path and require a non-empty value via
      # --dart-define, mirroring pro/Dockerfile and pro/build_web.sh. The value
      # here is a non-secret CI test constant that only gates these unit tests.
      # Soft-report coverage: local evidence is 87.18% RAW after #120; soft
      # report first so the runner becomes source of truth (no hard gate yet).
      - name: test (with coverage)
        run: |
          FLUTTER_TEST_CONCURRENCY=1 flutter test --no-pub --coverage --reporter compact \
            --dart-define=JWT_SHARED_SECRET=test-shared-secret \
            --dart-define=FORMULAE_BUILD_NONCE=ci-test-build-nonce \
            --dart-define=FORMULAE_APP_VERSION=0.0.0-ci
      - name: Summarize Pro line coverage (soft report)
        if: always()
        working-directory: .
        run: bash scripts/coverage-summary.sh pro/coverage/lcov.info "Pro Flutter"
      - name: Upload Pro lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-lcov
          path: pro/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
      - name: BFF client contract tests
        working-directory: pro/packages/formulaeapps_bff_client
        run: |
          flutter pub get
          dart test

  community-test:
    name: Community — flutter analyze + test (Principle VIII)
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'preload-wsl-bun'
    needs: [pro-test]
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 55
    defaults:
      run:
        working-directory: community
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: false
      - name: pub get path-dep package
        working-directory: community/packages/formulaeapps_bff_client
        run: flutter pub get
      - name: pub get main app
        run: flutter pub get
      - name: analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      # Same dart-defines as pro-test: auth minting path needs JWT_SHARED_SECRET.
      # Soft-report: local lcov was 85.44% (2026-07-17) and is stale vs post-7/17
      # churn — remasure on the runner; do not hard-gate until confirmed.
      - name: test (with coverage)
        run: |
          FLUTTER_TEST_CONCURRENCY=1 flutter test --no-pub --coverage --reporter compact \
            --dart-define=JWT_SHARED_SECRET=test-shared-secret \
            --dart-define=FORMULAE_BUILD_NONCE=ci-test-build-nonce \
            --dart-define=FORMULAE_APP_VERSION=0.0.0-ci
      - name: Summarize Community (monorepo) line coverage (soft report)
        if: always()
        working-directory: .
        run: bash scripts/coverage-summary.sh community/coverage/lcov.info "Community Flutter (monorepo)"
      - name: Upload Community lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-monorepo-lcov
          path: community/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
      - name: BFF client contract tests
        working-directory: community/packages/formulaeapps_bff_client
        run: |
          flutter pub get
          dart test

  landing-test:
    name: Landing — vitest (Principle VIII)
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'preload-wsl-bun'
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      # Astro check needs a current LTS; pin via NODE_VERSION (warm toolcache).
      - name: Setup Node (required by astro check)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ensure Bun 1.3.14
        working-directory: .
        run: bash scripts/ci-ensure-bun.sh 1.3.14 --verify-only
      - name: Install deps
        run: bun install --frozen-lockfile
      # Soft-report: vitest coverage include is intentionally narrow
      # (consts.ts + src/i18n/**). Printed % is honest for that include set —
      # not a claim over the full Astro UI surface.
      - name: Unit tests (with coverage)
        run: bun run test:coverage
      - name: Summarize Landing line coverage (soft report)
        if: always()
        working-directory: .
        run: bash scripts/coverage-summary.sh landing/coverage/lcov.info "Landing (vitest include set)"
      - name: Upload Landing lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-lcov
          path: landing/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
      - name: Lint
        run: bun run lint
      - name: Validate canonical Formulae images
        run: bun run check:formulae-images
      - name: Build
        run: bun run build
