name: Release Policy

on:
  workflow_dispatch:

  schedule:
    # Local-first policy: PR/push validation runs on the developer machine.
    # Remote CI is manual or staggered daily (validation only — no production deploy).
    - cron: '10 8 * * *'
jobs:
  release-policy:
    uses: CAPDESIS/.github/.github/workflows/release-policy-check.yml@8d306cba7300944685df609dd7e07e93723e73f5
    with:
      enforce: true
      runner-label: policy-light
