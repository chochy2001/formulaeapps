name: Release Policy

on:
  workflow_dispatch:
  schedule:
    # Daily validation for this public mirror; it never deploys production.
    - cron: '10 8 * * *'

permissions:
  contents: read

jobs:
  release-policy:
    name: Audit release gates
    # CAPDESIS/.github is private and cannot be invoked by this public mirror.
    # Keep the policy self-contained on an ephemeral runner instead of failing
    # before a job is created or waiting on organization-only runner labels.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # El control vive en scripts/ y se prueba antes de usarse. Estuvo rojo a
      # diario desde al menos 2026-07-24 (95 fallos contra 1 acierto) por un
      # falso positivo: marcaba "docker compose config", que solo renderiza el
      # fichero, como capacidad de despliegue. Un gate que se equivoca a diario
      # deja de leerse, y entonces no protege nada el dia que acierta.
      - name: Test the policy classifier
        shell: bash
        run: bash scripts/audit-public-mirror-policy.test.sh

      - name: Audit deploy safeguards
        shell: bash
        run: bash scripts/audit-public-mirror-policy.sh
