name: Release Policy

on:
  workflow_dispatch:

  schedule:
    # Local-first policy: PR/push validation runs on the developer machine.
    # Remote CI is manual or staggered daily (validation only — no production deploy).
    - cron: '10 8 * * *'
jobs:
  release-policy:
    uses: CAPDESIS/.github/.github/workflows/release-policy-check.yml@main
    with:
      enforce: false
      runner-label: policy-light
      production-day: monday
