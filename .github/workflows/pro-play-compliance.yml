name: Pro Play Compliance

# Lightweight gate for Google Play targetSdk 36 + Billing Library 8+ (2026-08-31).
# No Flutter build — text/lock checks only.

on:
  pull_request:
    paths:
      - 'pro/android/**'
      - 'pro/pubspec.yaml'
      - 'pro/pubspec.lock'
      - 'pro/lib/main.dart'
      - 'pro/docs/ANDROID_16_PLAY_COMPLIANCE.md'
      - 'scripts/verify-pro-play-compliance.sh'
      - '.github/workflows/pro-play-compliance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pro-play-compliance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-pro-play-compliance
    # PRs stay on the hosted isolation path; trusted manual validation uses the
    # preloaded policy runner without exposing secrets to fork code.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","ci-runner-node","policy-light"]') }}
    timeout-minutes: 5
    steps:
      - name: Validate self-hosted runner for trusted events
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ runner.environment }}" != "self-hosted" ]; then
            echo "::error::Trusted compliance validation must run on a self-hosted runner"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify Pro Play API 36 + Billing 8 pins
        run: bash scripts/verify-pro-play-compliance.sh
