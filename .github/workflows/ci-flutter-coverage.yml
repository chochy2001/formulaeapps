name: Flutter coverage remasure

# Isolated remasure lane for Pro/Community soft-report while the main CI
# workflow is being cancel-stomped by overlapping maintenance dispatches
# (2026-07-22). Unique per-run concurrency group; never cancels siblings.
# Keep APK/Docker on build-heavy in deploy/store workflows.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: flutter-coverage-remasure-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pro-test:
    name: Pro — flutter analyze + test + coverage
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 55
    defaults:
      run:
        working-directory: pro
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: false
      - name: pub get path-dep package
        working-directory: pro/packages/formulaeapps_bff_client
        run: flutter pub get
      - name: pub get main app
        run: flutter pub get
      - name: analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: test (with coverage)
        run: |
          FLUTTER_TEST_CONCURRENCY=1 flutter test --no-pub --coverage --reporter compact \
            --dart-define=JWT_SHARED_SECRET=test-shared-secret \
            --dart-define=FORMULAE_BUILD_NONCE=ci-test-build-nonce \
            --dart-define=FORMULAE_APP_VERSION=0.0.0-ci
      - name: Summarize Pro line coverage (soft report)
        if: always()
        working-directory: .
        run: bash scripts/coverage-summary.sh pro/coverage/lcov.info "Pro Flutter"
      - name: Upload Pro lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-lcov
          path: pro/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
      - name: BFF client contract tests
        working-directory: pro/packages/formulaeapps_bff_client
        run: |
          flutter pub get
          dart test

  community-test:
    name: Community — flutter analyze + test + coverage
    needs: [pro-test]
    runs-on: [self-hosted, ci-runner-node, test-light]
    timeout-minutes: 55
    defaults:
      run:
        working-directory: community
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: false
      - name: pub get path-dep package
        working-directory: community/packages/formulaeapps_bff_client
        run: flutter pub get
      - name: pub get main app
        run: flutter pub get
      - name: analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: test (with coverage)
        run: |
          FLUTTER_TEST_CONCURRENCY=1 flutter test --no-pub --coverage --reporter compact \
            --dart-define=JWT_SHARED_SECRET=test-shared-secret \
            --dart-define=FORMULAE_BUILD_NONCE=ci-test-build-nonce \
            --dart-define=FORMULAE_APP_VERSION=0.0.0-ci
      - name: Summarize Community (monorepo) line coverage (soft report)
        if: always()
        working-directory: .
        run: bash scripts/coverage-summary.sh community/coverage/lcov.info "Community Flutter (monorepo)"
      - name: Upload Community lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-monorepo-lcov
          path: community/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
      - name: BFF client contract tests
        working-directory: community/packages/formulaeapps_bff_client
        run: |
          flutter pub get
          dart test
