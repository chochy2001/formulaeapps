<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decoración matemática a la derecha -->
  <g opacity="0.18" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="980" y="190" font-size="180" text-anchor="middle">&#8721;</text>
    <text x="930" y="380" font-size="120" text-anchor="middle">&#960;</text>
    <text x="1070" y="430" font-size="140" text-anchor="middle">&#8747;</text>
    <text x="1010" y="540" font-size="80" text-anchor="middle">&#8730;</text>
  </g>

  <!-- Marca universal -->
  <text x="80" y="245" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="96" font-weight="800">Formulae</text>

  <!-- Notación matemática, sin copy localizado -->
  <text x="80" y="355" fill="#e0e7ff" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-style="italic">f(x) = ∫ x² dx</text>
  <text x="80" y="455" fill="#a5b4fc" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic">Σ · π · √</text>

  <!-- Línea decorativa -->
  <rect x="80" y="535" width="80" height="4" rx="2" fill="#fbbf24"/>
</svg>
