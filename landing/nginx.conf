#  Config nginx para servir un build estático de Astro con clean URLs.
#  Se monta en /etc/nginx/conf.d/default.conf dentro del contenedor.
#
#  Astro genera con build.format='directory' (ver astro.config.mjs):
#     dist/index.html
#     dist/pro/index.html
#     dist/en/pro/index.html
#     dist/sitemap-index.xml
#     dist/robots.txt
#     dist/_assets/<hash>.css|js|png  (inmutables, hash en el nombre)
#
#  El truco de "clean URLs" es try_files $uri $uri.html → si /pro no
#  existe como archivo, intenta /pro.html y lo sirve.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # No anunciar la versión de nginx en headers ni en páginas de error
    server_tokens off;

    # ────────────────  Headers de seguridad  ────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP relajada para Google Fonts. Si añades scripts de terceros (GA, etc.),
    # amplía script-src y connect-src en consecuencia.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ────────────────  Compresión  ────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Legacy locale-specific diagram routes are aliases, never alternate
    # translated bitmaps. Retain a temporary redirect for already-installed
    # app versions until remote telemetry confirms they have aged out.
    location = /imagenes_ingles/clic_card_buy.png {
        return 302 /imagenes/carrito_comprar.png;
    }

    location ^~ /imagenes_ingles/ {
        rewrite ^/imagenes_ingles/(.+)$ /imagenes/$1 redirect;
    }

    # ────────────────  Cache por tipo de recurso  ────────────────

    # Astro emite hashes en /_assets/, son inmutables → cache 1 año.
    location /_assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # Imágenes y favicons fuera de /_assets (manifest, og, etc.) → 30 días.
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|avif|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # Fuentes locales (si las llegas a auto-hostear) → 1 año, inmutables.
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    # robots.txt → cache corto, los crawlers releen con frecuencia.
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # sitemap-index.xml y sitemap-N.xml → cache 1 día.
    location ~ ^/sitemap.*\.xml$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # HTML → cache corto + must-revalidate. Los deploys nuevos se ven rápido.
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # ────────────────  Clean URLs (la regla central)  ────────────────
    #  /pro            → /pro/index.html
    #  /en/pro         → /en/pro/index.html
    #  /privacidad     → /privacidad/index.html
    #  cualquier otro  → 404
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # ────────────────  Errores  ────────────────
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ────────────────  Hardening misceláneo  ────────────────

    # Bloquea archivos ocultos excepto .well-known (ACME, security.txt, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Tira al instante peticiones a archivos backup típicos
    location ~* \.(bak|old|orig|swp|swo|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
