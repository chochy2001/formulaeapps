# Staging-only BFF stack. Never use production domains, networks, or secret paths.
# Deploy with: docker compose -f docker-compose.staging.yml -p formulaeapps-staging

name: formulaeapps-staging

services:
  bff:
    image: formulaeapps-staging-bff:${CANDIDATE_SHA:-local}
    build: ./bff
    container_name: formulaeapps-staging-bff
    restart: unless-stopped
    env_file: [.env]
    networks: [staging_web_proxy, staging_bff_internal]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=staging_web_proxy'
      - 'traefik.http.routers.formulae-staging-bff-http.rule=Host(`staging.api.formulaeapps.com`)'
      - 'traefik.http.routers.formulae-staging-bff-http.entrypoints=web'
      - 'traefik.http.routers.formulae-staging-bff-http.middlewares=cl-redirect-https@file'
      - 'traefik.http.routers.formulae-staging-bff.rule=Host(`staging.api.formulaeapps.com`)'
      - 'traefik.http.routers.formulae-staging-bff.entrypoints=websecure'
      - 'traefik.http.routers.formulae-staging-bff.tls=true'
      - 'traefik.http.routers.formulae-staging-bff.tls.certresolver=myresolver'
      - 'traefik.http.routers.formulae-staging-bff.middlewares=security-headers@file,api-ratelimit@file,gzip-compress@file'
      - 'traefik.http.services.formulae-staging-bff.loadbalancer.server.port=3000'

networks:
  staging_web_proxy:
    external: true
  staging_bff_internal:
    driver: bridge
