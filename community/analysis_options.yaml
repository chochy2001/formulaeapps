include: package:flutter_lints/flutter.yaml
analyzer:
  exclude:
    # Generated BFF client lives at packages/formulaeapps_bff_client/ via
    # path-dep; the generator emits a few unused_import warnings that are
    # harmless for codegen output. The generator's own analysis_options.yaml
    # handles its lints.
    - "packages/**"
    - "**.g.dart"
    - "**.freezed.dart"
    # Plugin artifacts checked out under build/ios/SourcePackages/ during local
    # iOS builds are not project source and can conflict with pub-cache copies.
    - "build/**"
