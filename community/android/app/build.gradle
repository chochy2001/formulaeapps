plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" version "4.3.15" apply false
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def googleTestAdMobApplicationId = 'ca-app-pub-3940256099942544~3347511713'
def productionAdMobApplicationId = providers.gradleProperty('ADMOB_ANDROID_APP_ID').orNull
def isValidProductionAdMobApplicationId = { appId ->
    appId != null &&
        appId ==~ /^ca-app-pub-\d{16}~\d{10}$/ &&
        appId != googleTestAdMobApplicationId
}

android {
    compileSdkVersion 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }


    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "capdesis.formulae"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders = [applicationName: "android.app.Application"]
    }


    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            // Google's official test application ID is restricted to local
            // development. Release never inherits this value.
            manifestPlaceholders.adMobApplicationId = googleTestAdMobApplicationId
        }
        release {
            manifestPlaceholders.adMobApplicationId =
                productionAdMobApplicationId ?: '__ADMOB_ANDROID_APP_ID_REQUIRED__'
            // Release signing requires key.properties. Local developer builds may
            // fall back to debug signing, but CI must fail closed so a store-bound
            // release is never debug-signed (fleet store auto-deploy policy).
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else if (!System.getenv('CI')) {
                signingConfig signingConfigs.debug
            } else {
                throw new GradleException(
                    'Release build in CI requires android/key.properties decoded from ' +
                    'the signing secrets; the debug signing fallback is disabled in CI.'
                )
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    namespace 'capdesis.formulae'
    lint {
        disable 'InvalidPackage'
    }
}

// Keep a packageable release from silently embedding Google's test app ID or
// a missing placeholder. Supply ADMOB_ANDROID_APP_ID through Gradle/CI only.
tasks.configureEach { task ->
    if (task.name.toLowerCase().contains('release')) {
        task.doFirst {
            if (!isValidProductionAdMobApplicationId(productionAdMobApplicationId)) {
                throw new GradleException(
                    'Release AdMob requires a non-test ADMOB_ANDROID_APP_ID ' +
                    '(ca-app-pub-<16 digits>~<10 digits>) provided via Gradle/CI.'
                )
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
