plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.capdesis.formulae_pro.formulae_calculo_pro"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    flavorDimensions "edition"
    productFlavors {
        pro {
            dimension "edition"
            applicationId "com.capdesis.formulae_pro.formulae_calculo_pro"
            resValue "string", "app_name", "Formulae Pro"
        }
        community {
            dimension "edition"
            applicationId "capdesis.formulae"
            resValue "string", "app_name", "Formulae Community"
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            // Release signing requires key.properties. Local developer builds may
            // fall back to debug signing, but CI must fail closed so a store-bound
            // release is never debug-signed (fleet store auto-deploy policy).
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else if (!System.getenv('CI')) {
                signingConfig signingConfigs.debug
            } else {
                throw new GradleException(
                    'Release build in CI requires android/key.properties decoded from ' +
                    'the signing secrets; the debug signing fallback is disabled in CI.'
                )
            }
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    namespace 'com.capdesis.formulae_pro.formulae_calculo_pro'
}
tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
    options.compilerArgs << "-Xlint:unchecked"
}

flutter {
    source '../..'
}

dependencies {
    // For AGP 7.4+
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.3")
    // For AGP 7.3
    // coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:1.2.3")
    // For AGP 4.0 to 7.2
    // coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:1.1.9")
}

// Google Play rejects updates built against Billing Library 7 after 2026-08-31.
// in_app_purchase_android ≥0.5 already depends on billing:8.0.0; this floor
// blocks any transitive downgrade back to 7.x without waiting for a full rebuild.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.android.billingclient") {
            def requested = details.requested.version ?: "0"
            def majorToken = requested.tokenize('.')[0]
            def major = majorToken.isInteger() ? majorToken.toInteger() : 0
            if (major < 8) {
                details.useVersion("8.0.0")
                details.because(
                    "Play Console requires Google Play Billing Library 8+ " +
                    "(Billing Library 7 deadline 2026-08-31)"
                )
            }
        }
    }
}
