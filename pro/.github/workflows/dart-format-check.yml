# 2026-05-15: migrated to self-hosted runner (was ubuntu-latest)
name: Check Dart Code Format

on:
  pull_request:
    branches: [main]

jobs:
  check-format:
    runs-on: [self-hosted, ci-runner-node, test-light]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Format generated localization files
        run: dart format lib/l10n

      - name: Check formatting
        run: dart format lib test bin --output=none --set-exit-if-changed
