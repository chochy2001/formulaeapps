server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    application/javascript
    application/json
    application/wasm
    image/svg+xml
    text/css
    text/plain;

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ^~ /pro/ {
    rewrite ^/pro/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
